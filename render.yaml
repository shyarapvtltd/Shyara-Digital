# Unique HTML files (about/index.html, invitations/wedding/index.html, landing pages)
# are written by `npm run build`. The catch-all rewrite is only the SPA fallback
# when a path has no matching file.
services:
  - type: web
    name: shyara-digital-static
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
